version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/Patrick-Ehimen/akave-crosschain-archive

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert

linters-settings:
  errcheck:
    # Ignore errors from deferred Close/Rollback calls (standard Go pattern).
    # Ignore json.Encoder.Encode in HTTP handlers (headers already sent, can't recover).
    exclude-functions:
      - (io.Closer).Close
      - (*github.com/jackc/pgx/v5.Tx).Rollback
      - (*encoding/json.Encoder).Encode
      - (*encoding/json.Decoder).Decode
      - (github.com/jackc/pgx/v5/pgxpool.Pool).Exec

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
