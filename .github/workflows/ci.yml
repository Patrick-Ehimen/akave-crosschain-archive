name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run ./...

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Run unit tests with coverage
        # Exclude cmd/* entrypoints and /tests/ (integration-only) from unit coverage.
        # DB-dependent packages (indexer, archiver) are tested in the integration step.
        run: |
          PKGS=$(go list ./... | grep -v '/cmd/' | grep -v '/tests/')
          go test -v -race -coverprofile=coverage.out -covermode=atomic $PKGS
      - name: Report coverage
        run: go tool cover -func=coverage.out | grep total
      - name: Check decoder coverage threshold (>85%)
        run: |
          # Only test the protocol sub-packages — the parent package (types/registry) has no tests by design
          DECODER_PKGS=$(go list ./internal/decoder/... | grep -v 'internal/decoder$')
          go test -coverprofile=decoder_coverage.out -covermode=atomic $DECODER_PKGS
          DECODER_COVERAGE=$(go tool cover -func=decoder_coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Decoder coverage: ${DECODER_COVERAGE}%"
          if (( $(echo "$DECODER_COVERAGE < 85" | bc -l) )); then
            echo "Decoder coverage ${DECODER_COVERAGE}% is below the required 85% threshold"
            exit 1
          fi
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: crosschain_archive_test
          POSTGRES_USER: crosschain
          POSTGRES_PASSWORD: crosschain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crosschain -d crosschain_archive_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Install migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: Run migrations
        env:
          DATABASE_URL: postgres://crosschain:crosschain@localhost:5432/crosschain_archive_test?sslmode=disable
        run: migrate -path migrations -database "$DATABASE_URL" up
      - name: Run all tests with coverage (DB available)
        env:
          DATABASE_URL: postgres://crosschain:crosschain@localhost:5432/crosschain_archive_test?sslmode=disable
        run: |
          PKGS=$(go list ./... | grep -v '/cmd/' | grep -v '/tests/')
          go test -v -race -coverprofile=full_coverage.out -covermode=atomic $PKGS
      - name: Check overall coverage threshold (>50%)
        run: |
          COVERAGE=$(go tool cover -func=full_coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage (with DB): ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 50" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below the required 50% threshold"
            exit 1
          fi
      - name: Upload full coverage report
        uses: actions/upload-artifact@v4
        with:
          name: full-coverage-report
          path: full_coverage.out

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Build binaries
        run: make build
      - name: Build Docker image
        run: docker build -t crosschain-archive:${{ github.sha }} .
